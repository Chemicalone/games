<meta charset="UTF-8">

<style>
  :root{
    --bg:#000;--fg:#aaa;--accent:#aaa;
    --card-bg:#0a0a0a;--card-border:#222;--card-radius:0px;
    --card-shadow:none;--card-border-style:solid;--card-border-w:1px;
    --font:monospace;--cursor:default;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--font);
    font-size:15px;cursor:var(--cursor);-webkit-tap-highlight-color:transparent;
    min-height:100vh;transition:background .5s,color .4s;
    position:relative;overflow-x:hidden;
  }

  /* ── DECO (same as index) ── */
  #deco-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
  body.deco-scan #deco-layer{background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.018) 3px,rgba(255,255,255,0.018) 4px);}
  body.deco-vignette #deco-layer{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.78) 100%);}
  body.deco-grid #deco-layer{background-image:linear-gradient(rgba(255,255,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.035) 1px,transparent 1px);background-size:24px 24px;}
  body.deco-cross #deco-layer{background-image:radial-gradient(rgba(255,255,255,0.07) 1px,transparent 1px);background-size:14px 14px;}
  body.deco-crt{box-shadow:inset 0 0 80px rgba(0,0,0,.9);}
  body.deco-crt #deco-layer{background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 3px);}
  body.deco-lines{background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.012) 2px,rgba(255,255,255,0.012) 3px);}
  body.deco-noise #deco-layer{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px;opacity:.06;}
  body.deco-glitch #deco-layer{animation:glitch-bg 7s infinite;}
  @keyframes glitch-bg{0%,94%,100%{opacity:0;transform:none;}95%{opacity:1;background:rgba(255,0,80,.04);transform:translate(-3px,0);}96%{opacity:1;background:rgba(0,255,200,.04);transform:translate(3px,0);}97%{opacity:1;background:rgba(255,255,0,.02);transform:translate(0,2px);}98%{opacity:0;transform:none;}}
  /* rgb: canvas-based, see JS */
  body.deco-pulse #page-wrap{animation:pulse-glow 3s ease-in-out infinite;}
  @keyframes pulse-glow{0%,100%{filter:drop-shadow(0 0 0px var(--accent));}50%{filter:drop-shadow(0 0 18px var(--accent));}}
  body.deco-static::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:998;animation:static-fl .08s steps(1) infinite;}
  @keyframes static-fl{0%{opacity:0;}8%{opacity:1;background:rgba(255,255,255,.025);transform:translate(-1px,0);}16%{opacity:0;}55%{opacity:0;}60%{opacity:1;background:rgba(255,255,255,.02);transform:translate(1px,1px);}68%{opacity:0;}100%{opacity:0;}}
  /* wave: margin-top invece di transform, evita conflitti con overflow:hidden */
  body.deco-wave #page-wrap{animation:wave-float 5s ease-in-out infinite;}
  @keyframes wave-float{0%,100%{margin-top:0px;}50%{margin-top:-10px;}}
  body.deco-corner .item-card::before,body.deco-corner .item-card::after{content:'';position:absolute;width:6px;height:6px;border-color:var(--accent);border-style:solid;border-width:0;opacity:0;transition:opacity .15s;}
  body.deco-corner .item-card::before{top:3px;left:3px;border-top-width:1px;border-left-width:1px;}
  body.deco-corner .item-card::after{bottom:3px;right:3px;border-bottom-width:1px;border-right-width:1px;}
  body.deco-corner .item-card:hover::before,body.deco-corner .item-card:hover::after{opacity:.5;}
  #sparkle-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .5s;}
  body.deco-sparkle #sparkle-canvas,body.deco-aurora #sparkle-canvas,body.deco-rain #sparkle-canvas,body.deco-ember #sparkle-canvas,body.deco-rgb #sparkle-canvas,body.deco-glitch #sparkle-canvas,body.deco-vizualizer #sparkle-canvas{opacity:1;}

  /* ── PAGE ── */
  #page-wrap{position:relative;z-index:1;padding:24px 18px 60px;max-width:600px;margin:0 auto;}

  /* ── HEADER ── */
  #shop-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;}
  #shop-title{font-size:18px;letter-spacing:5px;opacity:.4;}
  #pts-display{font-size:13px;}
  #pts-display span{color:var(--accent);}
  #back-btn{
    background:none;border:none;font-family:var(--font);font-size:13px;
    color:var(--fg);opacity:.4;cursor:pointer;padding:0;letter-spacing:1px;
  }
  #back-btn:hover{opacity:1;color:var(--accent);}

  /* ── SECTION ── */
  .section{margin-bottom:28px;}
  .section-title{
    font-size:11px;letter-spacing:4px;opacity:.3;
    margin-bottom:10px;padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-transform:uppercase;
  }

  /* ── ITEM GRID ── */
  .item-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .item-card{
    background:var(--card-bg);
    border-style:var(--card-border-style);border-width:var(--card-border-w);
    border-color:var(--card-border);border-radius:var(--card-radius);
    box-shadow:var(--card-shadow);
    padding:10px 13px;cursor:pointer;
    display:flex;flex-direction:column;gap:5px;
    transition:border-color .15s,color .15s,transform .1s;
    position:relative;overflow:hidden;
    font-family:var(--font);font-size:13px;color:var(--fg);
    min-width:120px;max-width:160px;flex:1;
    -webkit-appearance:none;appearance:none;text-align:left;
  }
  .item-card:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
  .item-card.equipped{border-color:var(--accent);color:var(--accent);}
  .item-card.equipped::after{
    content:'✓';position:absolute;top:6px;right:8px;
    font-size:10px;opacity:.7;color:var(--accent);
  }
  .item-card.cant-afford{opacity:.55;cursor:not-allowed;filter:none;}
  .item-card.cant-afford .item-cost{color:#844;opacity:1;}
  .item-card.cant-afford:hover{transform:none;border-color:var(--card-border);color:var(--fg);opacity:.55;}

  .item-preview{height:22px;display:flex;align-items:center;gap:6px;margin-bottom:2px;}
  .item-name{font-size:12px;letter-spacing:.5px;line-height:1.3;}
  .item-meta{font-size:10px;opacity:.35;display:flex;justify-content:space-between;align-items:center;}
  .item-cost{color:var(--accent);opacity:.8;}
  .item-tag{opacity:.25;font-size:9px;}

  /* preview blocks */
  .prev-swatch{width:14px;height:14px;border-radius:50%;}
  .prev-border{width:40px;height:14px;}
  .prev-text{font-size:13px;opacity:.9;}
  .prev-deco{font-size:14px;}
  .prev-icon{font-size:16px;}

  /* ── NOTIFY ── */
  #notify{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
    background:var(--card-bg);border:1px solid var(--accent);
    font-family:var(--font);font-size:13px;color:var(--accent);
    padding:8px 20px;z-index:9999;
    transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;
    letter-spacing:1px;white-space:nowrap;
  }
  #notify.show{transform:translateX(-50%) translateY(0);opacity:1;}

    'card-glow':'--card-bg:#0a0a0a;--card-border:#aaa;--card-radius:2px;--card-shadow:0 0 10px rgba(170,170,170,0.12);--card-border-style:solid;--card-border-w:1px',
    'card-dash':'--card-bg:#080808;--card-border:#333;--card-radius:0px;--card-shadow:none;--card-border-style:dashed;--card-border-w:1px',
    'card-thick':'--card-bg:#050505;--card-border:#333;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:3px',
    'card-retro':'--card-bg:#0d0d00;--card-border:#555;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:1px',
    'card-neon':'--card-bg:#000;--card-border:#0f0;--card-radius:0px;--card-shadow:0 0 8px rgba(0,255,0,0.25);--card-border-style:solid;--card-border-w:1px',
    'card-inset':'--card-bg:#050505;--card-border:#111;--card-radius:0px;--card-shadow:inset 0 2px 8px rgba(0,0,0,0.8);--card-border-style:solid;--card-border-w:1px',
    'card-ghost':'--card-bg:transparent;--card-border:#333;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:1px',
    'card-dotted':'--card-bg:#080808;--card-border:#444;--card-radius:0px;--card-shadow:none;--card-border-style:dotted;--card-border-w:1px',
    'card-round':'--card-bg:#0a0a0a;--card-border:#333;--card-radius:8px;--card-shadow:none;--card-border-style:solid;--card-border-w:1px',
    'card-groove':'--card-bg:#060606;--card-border:#555;--card-radius:0px;--card-shadow:none;--card-border-style:groove;--card-border-w:3px',
    'card-ridge':'--card-bg:#060606;--card-border:#555;--card-radius:0px;--card-shadow:none;--card-border-style:ridge;--card-border-w:3px',
    'card-bright':'--card-bg:#0a0a0a;--card-border:#fff;--card-radius:0px;--card-shadow:0 0 12px rgba(255,255,255,0.08);--card-border-style:solid;--card-border-w:1px',
  },
  accent:{
    'acc-aaa':'--accent:#aaa;--fg:#aaa','acc-0f0':'--accent:#0f0;--fg:#0d0',
    'acc-0ff':'--accent:#0ff;--fg:#0cc','acc-f80':'--accent:#f80;--fg:#c60',
    'acc-f0f':'--accent:#f0f;--fg:#c0c','acc-ff0':'--accent:#ff0;--fg:#cc0',
    'acc-f00':'--accent:#f00;--fg:#c00','acc-88f':'--accent:#88f;--fg:#66d',
    'acc-0af':'--accent:#0af;--fg:#08d','acc-fa0':'--accent:#fa0;--fg:#d80',
    'acc-aff':'--accent:#aff;--fg:#8ee','acc-f8a':'--accent:#f8a;--fg:#d68',
    'acc-lime':'--accent:#afa;--fg:#8d8','acc-coral':'--accent:#f86;--fg:#d64',
    'acc-sky':'--accent:#7df;--fg:#5bc','acc-gold2':'--accent:#ffd;--fg:#ccb',
    'acc-iceblue':'--accent:#acf;--fg:#8ad','acc-lemon':'--accent:#ef0;--fg:#cc0',
  },
  cursor:{
    'cur-default':'--cursor:default','cur-cross':'--cursor:crosshair',
    'cur-text':'--cursor:text','cur-none':'--cursor:none','cur-wait':'--cursor:wait',
    'cur-pointer':'--cursor:pointer','cur-grab':'--cursor:grab',
    'cur-ew':'--cursor:ew-resize','cur-zoom':'--cursor:zoom-in',
  },
  deco:{
    'deco-none':'none','deco-corner':'corner','deco-scan':'scan','deco-vignette':'vignette',
    'deco-grid':'grid','deco-cross':'cross','deco-crt':'crt','deco-noise':'noise',
    'deco-glitch':'glitch','deco-rgb':'rgb','deco-sparkle':'sparkle','deco-aurora':'aurora',
    'deco-rain':'rain','deco-ember':'ember','deco-pulse':'pulse','deco-static':'static',
    'deco-wave':'wave',
    'deco-vizualizer':'vizualizer',
  },
  menu:{'menu-list':'list','menu-center':'center','menu-grid':'grid'},
  desc:{'desc-show':'show','desc-hide':'hide'},
};

const CAT_LABELS = {
  bg:'sfondo', font:'carattere', card:'stile card', accent:'accento',
  cursor:'cursore', deco:'effetto schermo', menu:'layout menu', desc:'descrizioni giochi',
  music:'musica hub',
};

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
function getPoints(){ return parseInt(localStorage.getItem('campo-points')||'0'); }
function setPoints(n){ localStorage.setItem('campo-points',n); }
function getPurchased(){ return JSON.parse(localStorage.getItem('shop-purchased')||'["bg-dark","font-mono","card-plain","acc-aaa","cur-default","deco-none","menu-list","desc-show","mus-none"]'); }
function setPurchased(a){ localStorage.setItem('shop-purchased',JSON.stringify(a)); }
function getEquipped(){ return JSON.parse(localStorage.getItem('shop-equipped')||'{"bg":"bg-dark","font":"font-mono","card":"card-plain","accent":"acc-aaa","cursor":"cur-default","deco":"deco-none","menu":"menu-list","desc":"desc-show","music":"mus-none"}'); }
function setEquipped(o){ localStorage.setItem('shop-equipped',JSON.stringify(o)); }

let pts = getPoints();
let purchased = getPurchased();
let equipped  = getEquipped();

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function accentColor(id){
  const rule = CSS_MAP.accent[id]||'';
  const m = rule.match(/--accent:([^;]+)/);
  return m ? m[1].trim() : '#aaa';
}

function renderShop(){
  document.getElementById('pts-val').textContent = pts;

  const cats = [...new Set(ITEMS.map(i=>i.cat))];
  let html = '';
  cats.forEach(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat);
    html += `<div class="section">`;
    html += `<div class="section-title">${CAT_LABELS[cat]||cat}</div>`;
    html += `<div class="item-grid">`;
    items.forEach(item=>{
      const owned  = purchased.includes(item.id);
      const eq     = equipped[item.cat]===item.id;
      const afford = pts >= item.cost || owned;
      let cls = 'item-card';
      if(eq) cls += ' equipped';
      if(!afford) cls += ' cant-afford';

      // preview
      let prevHTML = '';
      if(cat==='bg'){
        const col = item.preview.replace('bg:','');
        prevHTML = `<span class="prev-swatch" style="background:${col};border:1px solid #333"></span>`;
        prevHTML += `<span class="prev-text" style="opacity:.5;font-size:11px">${col}</span>`;
      } else if(cat==='accent'){
        const col = item.preview.replace('acc:','');
        prevHTML = `<span class="prev-swatch" style="background:${col}"></span>`;
        prevHTML += `<span class="prev-text" style="color:${col}">${col}</span>`;
      } else if(cat==='font'){
        const fam = item.preview.replace('font:','');
        prevHTML = `<span class="prev-text" style="font-family:'${fam}',monospace">Aa 0x1F</span>`;
      } else if(cat==='card'){
        const parts = item.preview.replace('card:','');
        prevHTML = `<span class="prev-text" style="font-size:10px;opacity:.6">${parts}</span>`;
      } else if(cat==='cursor'){
        prevHTML = `<span class="prev-deco">${item.tag||'→'}</span>`;
      } else if(cat==='deco'){
        prevHTML = `<span class="prev-deco" style="font-size:16px">${item.preview.replace('deco:','')}</span>`;
      } else if(cat==='menu'){
        const icons = {list:'≡ ≡ ≡',center:'  ≡ ≡',grid:'⊞ ⊞'};
        prevHTML = `<span class="prev-text" style="font-size:10px;opacity:.6">${icons[item.id]||'—'}</span>`;
      } else if(cat==='desc'){
        prevHTML = `<span class="prev-text" style="font-size:10px;opacity:.6">${item.id==='desc-show'?'abc...':'abc'}</span>`;
      } else if(cat==='music'){
        const isNone = item.id==='mus-none';
        const isSystem = item.id==='mus-system';
        prevHTML = `<span class="prev-deco" style="font-size:15px">${isNone?'—':isSystem?'⚠':'♪'}</span>`;
        prevHTML += `<span class="prev-text" style="font-size:9px;opacity:.5;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:90px">${isNone?'nessuna':item.tag}</span>`;
      }

      html += `<button class="${cls}" data-id="${item.id}" onclick="handleItem('${item.id}')">
        <div class="item-preview">${prevHTML}</div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">
          <span class="item-cost">${owned?'✓ preso':item.cost===0?'gratis':item.cost+' pts'}</span>
          ${item.tag?`<span class="item-tag">${item.tag}</span>`:''}
        </div>
      </button>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('shop-content').innerHTML = html;
}

/* ══════════════════════════════════════════════
   AZIONI
══════════════════════════════════════════════ */
function handleItem(id){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  const owned = purchased.includes(id);

  if(!owned){
    if(pts < item.cost){ notify('punti insufficienti'); return; }
    pts -= item.cost;
    setPoints(pts);
    purchased.push(id);
    setPurchased(purchased);
    notify('acquistato: '+item.name);
  }

  // equip
  equipped[item.cat] = id;
  setEquipped(equipped);
  applyCosmetics();
  if(item.cat==='music') applyHubMusic();
  renderShop();
  if(owned) notify('equipaggiato: '+item.name);
}

/* ══════════════════════════════════════════════
   COSMETICS
══════════════════════════════════════════════ */
function applyCosmetics(){
  const eq = equipped;
  const root = document.documentElement;
  const body = document.body;

  ['bg','font','card','accent','cursor'].forEach(cat=>{
    const id = eq[cat];
    if(!id||!CSS_MAP[cat]||!CSS_MAP[cat][id]) return;
    CSS_MAP[cat][id].split(';').forEach(rule=>{
      const sep=rule.indexOf(':');
      if(sep===-1) return;
      root.style.setProperty(rule.slice(0,sep).trim(),rule.slice(sep+1).trim());
    });
  });

  const ALL_DECO=['scan','vignette','grid','cross','crt','corner','lines','noise',
    'glitch','rgb','sparkle','aurora','rain','ember','pulse','static','wave','vizualizer'];
  ALL_DECO.forEach(d=>body.classList.remove('deco-'+d));
  const dv = CSS_MAP.deco[eq['deco']];
  if(dv&&dv!=='none') body.classList.add('deco-'+dv);
  if(eq['bg']==='bg-ash') body.classList.add('deco-lines');

  initCanvas(eq['deco']);
}

/* ══════════════════════════════════════════════
   CANVAS
══════════════════════════════════════════════ */
let raf=null, parts=[];
function initCanvas(decoId){
  const cv=document.getElementById('sparkle-canvas');
  const cx=cv.getContext('2d');
  cancelAnimationFrame(raf);
  parts=[];
  if(window._cleanRgb){ window._cleanRgb(); window._cleanRgb=null; }
  cv.width=innerWidth; cv.height=innerHeight;
  const W=cv.width, H=cv.height;
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#aaa';

  if(decoId==='deco-sparkle'){
    for(let i=0;i<70;i++) parts.push(mkSparkle(W,H,acc));
    (function loop(){
      cx.clearRect(0,0,W,H);
      parts.forEach((p,i)=>{
        p.life-=p.spd;
        if(p.life<=0) parts[i]=mkSparkle(W,H,acc);
        const a=Math.max(0,Math.sin(p.life/p.max*Math.PI))*.75;
        cx.save(); cx.globalAlpha=a; cx.fillStyle=p.col;
        cx.font=p.sz+'px monospace'; cx.fillText(p.ch,p.x,p.y);
        cx.restore(); p.y+=p.vy;
      });
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-aurora'){
    let t=0;
    (function loop(){
      cx.clearRect(0,0,W,H); t+=0.004;
      for(let i=0;i<4;i++){
        const hue=(i*90+t*25)%360;
        const g=cx.createLinearGradient(0,0,W,0);
        g.addColorStop(0,`hsla(${hue},80%,55%,0)`);
        g.addColorStop(.5,`hsla(${hue},80%,55%,0.055)`);
        g.addColorStop(1,`hsla(${hue},80%,55%,0)`);
        cx.fillStyle=g;
        const y=H*(.15+i*.18)+Math.sin(t+i*1.3)*H*.08;
        cx.fillRect(0,y,W,70+Math.sin(t*.8+i)*35);
      }
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-rain'){
    const cols=Math.floor(W/14);
    const drops=Array.from({length:cols},()=>Math.random()*H);
    const chars='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂ0123456789ABCDEF░▒▓'.split('');
    (function loop(){
      cx.fillStyle='rgba(0,0,0,0.045)'; cx.fillRect(0,0,W,H);
      cx.font='13px monospace';
      drops.forEach((y,i)=>{
        const ch=chars[Math.floor(Math.random()*chars.length)];
        cx.globalAlpha=.6; cx.fillStyle=acc; cx.fillText(ch,i*14,y);
        cx.globalAlpha=.12; cx.fillText(ch,i*14,y-20); cx.globalAlpha=1;
        if(y>H&&Math.random()>.975) drops[i]=0;
        drops[i]+=14;
      });
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-ember'){
    for(let i=0;i<50;i++) parts.push(mkEmber(W,H,acc));
    (function loop(){
      cx.clearRect(0,0,W,H);
      const now=Date.now()*.001;
      parts.forEach((p,i)=>{
        p.y-=p.vy; p.x+=Math.sin(p.ph+now)*.6; p.life--;
        if(p.life<=0) parts[i]=mkEmber(W,H,acc);
        const a=p.life/p.max*.65;
        cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2);
        cx.fillStyle=p.col; cx.globalAlpha=a; cx.fill(); cx.globalAlpha=1;
      });
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-rgb'){
    /* aberrazione cromatica reale: sfasa rettangoli rosso/ciano
       con globalCompositeOperation per dare effetto split-channel */
    let t=0;
    (function loop(){
      cx.clearRect(0,0,W,H);
      t+=0.016;
      // attivo a impulsi irregolari
      if(Math.sin(t*0.9)>0.45 || Math.sin(t*2.3)>0.8){
        const shift=3+Math.random()*5;
        // striscia rossa a sinistra
        cx.globalAlpha=0.18;
        cx.fillStyle='rgb(255,0,0)';
        cx.fillRect(0,0,shift,H);
        // striscia ciano a destra
        cx.fillStyle='rgb(0,255,255)';
        cx.fillRect(W-shift,0,shift,H);
        // bande orizzontali spostate
        const nb=1+Math.floor(Math.random()*4);
        for(let l=0;l<nb;l++){
          const ly=Math.random()*H;
          const lh=1+Math.random()*4;
          const lx=(Math.random()-0.5)*shift*2;
          cx.globalAlpha=0.12+Math.random()*0.1;
          cx.fillStyle=Math.random()>0.5?'rgb(255,0,100)':'rgb(0,255,200)';
          cx.fillRect(lx,ly,W,lh);
        }
        cx.globalAlpha=1;
      }
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-glitch'){
    /* glitch: strisce di schermo che si spostano orizzontalmente
       + flash di colore + righe bianche di disturbo */
    let t=0;
    let glitchTimer=0;
    (function loop(){
      cx.clearRect(0,0,W,H);
      t+=0.016;
      glitchTimer-=0.016;
      // burst di glitch ogni 2-5 secondi
      if(glitchTimer<=0){
        glitchTimer=2+Math.random()*3;
        const nbSlices=3+Math.floor(Math.random()*5);
        for(let s=0;s<nbSlices;s++){
          const sy=Math.random()*H;
          const sh=2+Math.random()*20;
          const sx=(Math.random()-0.5)*30;
          // fascia spostata
          cx.globalAlpha=0.15+Math.random()*0.15;
          cx.fillStyle=`rgb(${200+Math.random()*55|0},${Math.random()*80|0},${Math.random()*80|0})`;
          cx.fillRect(sx,sy,W,sh);
          // fascia complementare
          cx.fillStyle=`rgba(0,255,200,0.08)`;
          cx.fillRect(-sx*.5,sy+sh,W,sh*.4);
        }
        // flash bianco totale rarissimo
        if(Math.random()<0.15){
          cx.globalAlpha=0.04;
          cx.fillStyle='white';
          cx.fillRect(0,0,W,H);
        }
        cx.globalAlpha=1;
      }
      raf=requestAnimationFrame(loop);
    })();
  }
  else if(decoId==='deco-vizualizer'){
    // Tenta di agganciarsi all'audio hub; se non c'è usa simulazione
    let analyser = null;
    if(window._hubAudioEl){
      try{
        const ac = new (window.AudioContext||window.webkitAudioContext)();
        const src = ac.createMediaElementSource(window._hubAudioEl);
        analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.8;
        src.connect(analyser);
        src.connect(ac.destination);
      }catch(e){ analyser = null; }
    }
    // barre sinistre e destre sovrapposte al canvas
    const BARS = 24;
    let simT = 0;
    const simPh = Array.from({length:BARS},()=>Math.random()*Math.PI*2);
    const simFr = Array.from({length:BARS},(_,i)=>0.4+i*0.05+Math.random()*0.15);
    const simAm = Array.from({length:BARS},(_,i)=>0.55*Math.exp(-i*0.04)+0.2);
    function getVals(){
      if(analyser){
        const buf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(buf);
        return Array.from({length:BARS},(_,i)=>buf[Math.floor(i*buf.length/BARS)]/255);
      }
      simT+=0.018;
      const beat=Math.pow(Math.max(0,Math.sin(simT*Math.PI*2)),8)*0.5;
      return Array.from({length:BARS},(_,i)=>{
        const w=Math.sin(simT*simFr[i]+simPh[i])*0.5+0.5;
        return Math.min(1,simAm[i]*w+beat*(1-i/BARS)*0.6+Math.random()*0.05);
      });
    }
    const panW = Math.floor(W*0.085); // ~8.5% larghezza per lato
    (function loop(){
      cx.clearRect(0,0,W,H);
      const vals = getVals();
      const gap=1, bh=Math.max(2,(H-gap*(BARS-1))/BARS);
      for(let i=0;i<BARS;i++){
        const v=vals[i];
        const hue=i/BARS*300;
        const alpha=0.55+v*0.35;
        // sinistra
        const bwL=Math.max(3,v*panW*0.92);
        const y=H-i*(bh+gap)-bh;
        const gL=cx.createLinearGradient(0,0,bwL,0);
        gL.addColorStop(0,`hsla(${hue},100%,55%,0.06)`);
        gL.addColorStop(1,`hsla(${hue},100%,65%,${alpha})`);
        cx.fillStyle=gL; cx.fillRect(0,y,bwL,bh);
        if(v>0.05){ cx.fillStyle=`hsla(${hue},100%,90%,0.9)`; cx.fillRect(bwL-2,y,2,bh); }
        // destra (speculare)
        const vi=vals[BARS-1-i];
        const hue2=(BARS-1-i)/BARS*300;
        const alpha2=0.55+vi*0.35;
        const bwR=Math.max(3,vi*panW*0.92);
        const gR=cx.createLinearGradient(W,0,W-bwR,0);
        gR.addColorStop(0,`hsla(${hue2},100%,55%,0.06)`);
        gR.addColorStop(1,`hsla(${hue2},100%,65%,${alpha2})`);
        cx.fillStyle=gR; cx.fillRect(W-bwR,y,bwR,bh);
        if(vi>0.05){ cx.fillStyle=`hsla(${hue2},100%,90%,0.9)`; cx.fillRect(W-bwR,y,2,bh); }
      }
      raf=requestAnimationFrame(loop);
    })();
  }
  const chars='✦✧⋆·˚◆◇★☆▪▸';
  return{x:Math.random()*W,y:Math.random()*H,ch:chars[Math.floor(Math.random()*chars.length)],
    sz:8+Math.random()*10,col:acc,life:Math.random()*100,max:80+Math.random()*60,
    spd:.5+Math.random()*.8,vy:-.15+Math.random()*.3};
}
function mkEmber(W,H,acc){
  return{x:Math.random()*W,y:H+10,r:1+Math.random()*2.5,
    vy:.6+Math.random()*1.5,ph:Math.random()*Math.PI*2,col:acc,
    life:60+Math.random()*140,max:200};
}
window.addEventListener('resize',()=>{
  const cv=document.getElementById('sparkle-canvas');
  cv.width=innerWidth;cv.height=innerHeight;
});

/* ══════════════════════════════════════════════
   NOTIFY
══════════════════════════════════════════════ */
let notifyT=null;
function notify(msg){
  const el=document.getElementById('notify');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(notifyT);
  notifyT=setTimeout(()=>el.classList.remove('show'),1600);
}

/* ══════════════════════════════════════════════
   AUDIO HUB
══════════════════════════════════════════════ */
let hubAudio = null;
function getMusicFile(id){
  const item = ITEMS.find(i=>i.id===id);
  return item ? item.file : null;
}
function playHubMusic(id){
  if(hubAudio){ hubAudio.pause(); hubAudio.src=''; hubAudio=null; window._hubAudioEl=null; }
  const file = getMusicFile(id);
  if(!file) return;
  hubAudio = new Audio(file);
  hubAudio.loop = true;
  hubAudio.volume = 0.45;
  hubAudio.play().catch(()=>{});
  window._hubAudioEl = hubAudio;
}
function applyHubMusic(){
  const eq = getEquipped();
  const musId = eq['music']||'mus-none';
  // salva anche su localStorage per index.html
  const item = ITEMS.find(i=>i.id===musId);
  localStorage.setItem('hub-music', item&&item.file ? item.file : '');
  playHubMusic(musId);
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
applyCosmetics();
applyHubMusic();
renderShop();
</script>
