<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hub</title>
<style>
  body {
    background: #000;
    color: #aaa;
    font-family: monospace;
    font-size: 16px;
    padding: 20px;
    margin: 0;
    -webkit-tap-highlight-color: transparent;
  }
  #points-bar { margin-bottom: 12px; color: #888; font-size: 14px; }
  #screen { white-space: pre; }
  #input-line { margin-top: 10px; }
  input[type=text] {
    background: #000; color: #aaa; border: none; outline: none;
    font-family: monospace; font-size: 16px; caret-color: #aaa; width: 3ch;
  }

  /* bottoni menu mobile */
  #menu-btns {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    max-width: 240px;
  }
  .menu-btn {
    background: #111; color: #aaa; border: 1px solid #333;
    font-family: monospace; font-size: 15px; padding: 10px 16px;
    cursor: pointer; text-align: left; border-radius: 2px;
  }
  .menu-btn:active { background: #222; }

  @media (pointer: coarse) {
    #input-line { display: none; }
    #menu-btns  { display: flex; }
  }
</style>
</head>
<body>

<div id="points-bar">points: <span id="points-count">0</span></div>
<div id="screen"></div>
<div id="input-line"><span id="prompt"></span><input type="text" id="cmd" maxlength="1" autocomplete="off" /></div>
<div id="menu-btns">
  <button class="menu-btn" onclick="menuChoice('1')">1) figet</button>
  <button class="menu-btn" onclick="menuChoice('2')">2) shop</button>
  <button class="menu-btn" onclick="menuChoice('3')">3) casino</button>
  <button class="menu-btn" onclick="menuChoice('4')">4) battaglie</button>
  <button class="menu-btn" onclick="menuChoice('5')">5) campo di battaglia</button>
</div>

<script>
const pointsCount = document.getElementById('points-count');
function getPoints()       { return parseInt(localStorage.getItem('campo-points') || '0'); }
function updatePointsBar() { pointsCount.textContent = getPoints(); }
updatePointsBar();

const screen   = document.getElementById('screen');
const promptEl = document.getElementById('prompt');
const cmdInput = document.getElementById('cmd');

function showMenu() {
  screen.textContent =
    'scegli un gioco\n1) figet\n2) shop\n3) casino\n4) battaglie\n5) campo di battaglia\n';
  promptEl.textContent = 'scelta: ';
  cmdInput.value = '';
  cmdInput.focus();
}

function menuChoice(val) {
  if      (val === '1') window.location.href = 'figget.html';
  else if (val === '2') { screen.textContent = 'lascialo non implementato\n'; promptEl.textContent = ''; setTimeout(showMenu, 1000); }
  else if (val === '3') window.location.href = 'casino.html';
  else if (val === '4') window.location.href = 'index_battaglie.html';
  else if (val === '5') window.location.href = 'campo.html';
  else { screen.textContent = 'scelta non valida\n'; promptEl.textContent = ''; setTimeout(showMenu, 800); }
}

cmdInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const val = cmdInput.value.trim();
  cmdInput.value = '';
  menuChoice(val);
});

showMenu();
cmdInput.focus();
document.addEventListener('click', () => cmdInput.focus());
</script>
</body>
</html>
