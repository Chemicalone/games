<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #aaa;
    --accent: #aaa;
    --card-bg: #0a0a0a;
    --card-border: #222;
    --card-radius: 0px;
    --card-shadow: none;
    --card-border-style: solid;
    --card-border-w: 1px;
    --font: monospace;
    --cursor: default;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    padding: 24px 20px;
    cursor: var(--cursor);
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background 0.4s, color 0.4s;
    position: relative;
  }

  /* ── DECO LAYERS ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  body.deco-scan::before {
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px
    );
  }
  body.deco-vignette::before {
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }
  body.deco-grid::before {
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  body.deco-cross::before {
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  body.deco-crt {
    box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
  }
  body.deco-lines {
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px
    );
  }
  body.deco-corner #hub-wrap::before, body.deco-corner #hub-wrap::after {
    content: ''; position: absolute;
    width: 14px; height: 14px;
    border-color: var(--accent); border-style: solid; border-width: 0;
    opacity: 0.35;
  }
  body.deco-corner #hub-wrap { position: relative; }
  body.deco-corner #hub-wrap::before { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
  body.deco-corner #hub-wrap::after  { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

  /* ── LAYOUT ── */
  #hub-wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
  }

  /* ── HEADER ── */
  #header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  #hub-title {
    font-size: 20px;
    letter-spacing: 6px;
    opacity: 0.5;
  }
  #points-bar {
    font-size: 13px;
    opacity: 0.8;
  }
  #points-bar span {
    color: var(--accent);
  }

  /* ── GAME CARDS ── */
  #menu-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .game-card {
    background: var(--card-bg);
    border-style: var(--card-border-style);
    border-width: var(--card-border-w);
    border-color: var(--card-border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s, color 0.15s, transform 0.12s;
    position: relative;
    overflow: hidden;
    /* reset button styles */
    font-family: var(--font);
    font-size: 15px;
    color: var(--fg);
    text-align: left;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .game-card:hover,
  .game-card:focus {
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
    transform: translateX(3px);
  }
  .game-card:active {
    transform: translateX(6px);
  }

  .card-num {
    opacity: 0.3;
    font-size: 13px;
    min-width: 2ch;
  }
  .card-name {
    flex: 1;
    letter-spacing: 1px;
  }
  .card-arrow {
    opacity: 0.2;
    font-size: 12px;
    transition: opacity 0.15s;
  }
  .game-card:hover .card-arrow,
  .game-card:focus .card-arrow {
    opacity: 0.7;
  }

  /* deco-corner sulle card */
  body.deco-corner .game-card::before,
  body.deco-corner .game-card::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  body.deco-corner .game-card::before { top: 4px; left: 4px; border-top-width: 1px; border-left-width: 1px; }
  body.deco-corner .game-card::after  { bottom: 4px; right: 4px; border-bottom-width: 1px; border-right-width: 1px; }
  body.deco-corner .game-card:hover::before,
  body.deco-corner .game-card:hover::after { opacity: 0.5; }
</style>
</head>
<body>

<div id="hub-wrap">
  <div id="header">
    <div id="hub-title">[ hub ]</div>
    <div id="points-bar">pts: <span id="points-count">0</span></div>
  </div>

  <div id="menu-cards">
    <button class="game-card" onclick="go('figget.html')">
      <span class="card-num">1</span>
      <span class="card-name">figet</span>
      <span class="card-arrow">▶</span>
    </button>
    <button class="game-card" onclick="go('casino.html')">
      <span class="card-num">2</span>
      <span class="card-name">casino</span>
      <span class="card-arrow">▶</span>
    </button>
    <button class="game-card" onclick="go('index_battaglie.html')">
      <span class="card-num">3</span>
      <span class="card-name">battaglie</span>
      <span class="card-arrow">▶</span>
    </button>
    <button class="game-card" onclick="go('campo.html')">
      <span class="card-num">4</span>
      <span class="card-name">campo di battaglia</span>
      <span class="card-arrow">▶</span>
    </button>
    <button class="game-card" onclick="go('shop.html')">
      <span class="card-num">5</span>
      <span class="card-name">shop</span>
      <span class="card-arrow">▶</span>
    </button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  COSMETICI — stessa logica dello shop
// ──────────────────────────────────────────────
const CSS_MAP = {
  bg: {
    'bg-dark':   '--bg:#000',
    'bg-matrix': '--bg:#001200',
    'bg-blood':  '--bg:#120000',
    'bg-deep':   '--bg:#00001a',
    'bg-ash':    '--bg:#0e0e0e',
    'bg-amber':  '--bg:#100800',
    'bg-ice':    '--bg:#00080f',
    'bg-purple': '--bg:#0a0010',
  },
  font: {
    'font-mono':    '--font:monospace',
    'font-courier': "--font:'Courier New',monospace",
    'font-vt323':   "--font:'VT323',monospace",
    'font-share':   "--font:'Share Tech Mono',monospace",
    'font-ibm':     "--font:'IBM Plex Mono',monospace",
  },
  card: {
    'card-plain':  '--card-bg:#0a0a0a;--card-border:#222;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:1px',
    'card-double': '--card-bg:#080808;--card-border:#444;--card-radius:0px;--card-shadow:none;--card-border-style:double;--card-border-w:2px',
    'card-glow':   '--card-bg:#0a0a0a;--card-border:#aaa;--card-radius:2px;--card-shadow:0 0 10px rgba(170,170,170,0.12);--card-border-style:solid;--card-border-w:1px',
    'card-dash':   '--card-bg:#080808;--card-border:#333;--card-radius:0px;--card-shadow:none;--card-border-style:dashed;--card-border-w:1px',
    'card-thick':  '--card-bg:#050505;--card-border:#333;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:3px',
    'card-retro':  '--card-bg:#0d0d00;--card-border:#555;--card-radius:0px;--card-shadow:none;--card-border-style:solid;--card-border-w:1px',
    'card-neon':   '--card-bg:#000;--card-border:#0f0;--card-radius:0px;--card-shadow:0 0 8px rgba(0,255,0,0.25);--card-border-style:solid;--card-border-w:1px',
  },
  accent: {
    'acc-aaa': '--accent:#aaa;--fg:#aaa',
    'acc-0f0': '--accent:#0f0;--fg:#0d0',
    'acc-0ff': '--accent:#0ff;--fg:#0cc',
    'acc-f80': '--accent:#f80;--fg:#c60',
    'acc-f0f': '--accent:#f0f;--fg:#c0c',
    'acc-ff0': '--accent:#ff0;--fg:#cc0',
    'acc-f00': '--accent:#f00;--fg:#c00',
    'acc-88f': '--accent:#88f;--fg:#66d',
  },
  cursor: {
    'cur-default': '--cursor:default',
    'cur-cross':   '--cursor:crosshair',
    'cur-text':    '--cursor:text',
    'cur-none':    '--cursor:none',
    'cur-wait':    '--cursor:wait',
  },
  deco: {
    'deco-none':     'none',
    'deco-corner':   'corner',
    'deco-scan':     'scan',
    'deco-vignette': 'vignette',
    'deco-grid':     'grid',
    'deco-cross':    'cross',
    'deco-crt':      'crt',
  },
};

function applyCosmetics() {
  const equipped = JSON.parse(localStorage.getItem('shop-equipped') || '{}');
  const root = document.documentElement;

  ['bg','font','card','accent','cursor'].forEach(cat => {
    const id = equipped[cat];
    if (!id || !CSS_MAP[cat] || !CSS_MAP[cat][id]) return;
    CSS_MAP[cat][id].split(';').forEach(rule => {
      const sep = rule.indexOf(':');
      if (sep === -1) return;
      const prop = rule.slice(0, sep).trim();
      const val  = rule.slice(sep + 1).trim();
      if (prop && val !== undefined) root.style.setProperty(prop, val);
    });
  });

  // deco: classi su body
  const body = document.body;
  body.classList.remove('deco-scan','deco-vignette','deco-grid','deco-cross','deco-crt','deco-corner','deco-lines');
  const decoId = equipped['deco'];
  if (decoId && CSS_MAP.deco[decoId]) {
    const dv = CSS_MAP.deco[decoId];
    if (dv !== 'none') body.classList.add('deco-' + dv);
  }

  // bg-ash aggiunge le linee
  if (equipped['bg'] === 'bg-ash') body.classList.add('deco-lines');
}

applyCosmetics();

// ──────────────────────────────────────────────
//  PUNTI
// ──────────────────────────────────────────────
function getPoints() { return parseInt(localStorage.getItem('campo-points') || '0'); }
document.getElementById('points-count').textContent = getPoints();

// ──────────────────────────────────────────────
//  NAVIGAZIONE
// ──────────────────────────────────────────────
function go(href) { window.location.href = href; }
</script>
</body>
</html>
