<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVP – Scheda del personaggio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#16100c;--leather:#2b1c12;--leather2:#3a2718;--parch:#e6d5ab;--parch2:#d4bd88;--gold:#c9a227;--blood:#8f1d1d;--text:#2a1b0e;--ok:#2f6b3a;
--head:'Cinzel','Trajan Pro',Georgia,serif;--body:'IM Fell English',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);font-size:18px;color:var(--text);
background:radial-gradient(ellipse at top,#3d2a1a 0%,var(--ink) 70%) fixed;min-height:100vh;padding:20px 14px 60px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-family:var(--head);color:var(--gold);text-align:center;font-size:clamp(26px,5vw,42px);letter-spacing:.06em;margin:6px 0 4px;text-shadow:0 2px 0 #000}
.sub{text-align:center;color:var(--parch2);font-style:italic;margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
button,.btn{font-family:var(--head);font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--gold);background:var(--leather2);color:var(--parch);padding:10px 18px;border-radius:3px;letter-spacing:.04em}
button:hover,.btn:hover{background:var(--blood);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.main{background:var(--blood);border-color:var(--gold);color:#fff}
.btn.main:hover{background:#b02727}
.sheet{background:linear-gradient(var(--parch),var(--parch2));border:3px solid var(--gold);border-radius:4px;padding:20px;margin-bottom:20px;box-shadow:0 0 0 6px var(--leather),0 10px 30px #000a}
h2{font-family:var(--head);margin:0 0 14px;font-size:20px;border-bottom:2px solid var(--blood);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h2 small{font-family:var(--body);font-size:16px;font-weight:400;color:var(--blood)}
.top{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.top label{flex:1;min-width:220px;font-family:var(--head);font-size:13px}
input[type=text]{width:100%;font-family:var(--head);font-size:24px;background:transparent;border:0;border-bottom:2px solid var(--text);padding:4px 2px;color:var(--text)}
.hp{text-align:center;font-family:var(--head);border:3px solid var(--blood);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;width:96px;height:96px;display:flex;flex-direction:column;justify-content:center;background:#f3e6c4}
.hp b{font-size:32px;color:var(--blood);line-height:1}.hp span{font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:14px}
.stat{text-align:center;background:var(--leather);color:var(--parch);border:2px solid var(--gold);border-radius:6px;padding:10px 6px 12px}
.stat .n{font-family:var(--head);font-size:13px}
.d20{width:84px;height:92px;margin:6px auto;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center}
.d20 div{width:78px;height:86px;background:var(--ink);clip-path:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d20 b{font-family:var(--head);font-size:30px;line-height:1;color:var(--parch)}
.d20 i{font-size:13px;color:var(--gold)}
.ctl{display:flex;justify-content:center;gap:8px;align-items:center}
.ctl button{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
button:disabled{opacity:.3;cursor:not-allowed}button:disabled:hover{background:var(--leather2)}
.cost{font-size:14px;color:var(--parch2);margin-top:4px}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.move{display:flex;gap:10px;align-items:center;text-align:left;font-family:var(--body);font-weight:400;font-size:17px;background:#f3e6c4;color:var(--text);border:2px solid var(--parch2);padding:8px 10px;letter-spacing:0}
.move:hover{background:#f3e6c4;color:var(--text);border-color:var(--blood)}
.move .ic{font-size:26px}.move .c{margin-left:auto;font-family:var(--head);font-size:13px;background:var(--text);color:var(--parch);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.move.on{background:var(--leather);color:var(--parch);border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--blood)}
.move.on:hover{border-color:var(--gold)}
.move.on .c{background:var(--gold);color:var(--ink)}
.move:disabled{opacity:.4}
.bad{color:var(--blood);font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--parch);border:2px solid var(--gold);padding:12px 20px;border-radius:3px;font-family:var(--head);font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}#toast.err{border-color:#e05555;color:#ffb3b3}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fc{background:var(--leather);color:var(--parch);border:2px solid var(--leather2);border-radius:6px;padding:12px;font-family:var(--head);text-align:center;min-height:160px}
.fc.act{border-color:var(--gold);box-shadow:0 0 0 3px var(--blood)}.fc.ko{opacity:.5}
.hpb{height:14px;background:#0008;border:1px solid var(--gold);border-radius:7px;margin:8px 0 4px;overflow:hidden}
.hpb i{display:block;height:100%;background:var(--blood);transition:width .4s}
.hpn{font-size:14px}
.chip{display:inline-block;margin:6px 3px 0;padding:2px 8px;border:1px solid var(--gold);border-radius:10px;font-size:12px}
.slot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.slot span{flex:1;min-width:200px}
#turn{margin:6px 0 12px;font-size:19px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.move .dm{margin-left:auto;font-size:13px;font-family:var(--head)}
.move .nm{display:flex;flex-direction:column;gap:2px;text-align:left}
.move .nm small{font-family:var(--head);font-size:12px;opacity:.85}
#bmoves{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.hp.mp{border-color:#2b5fa8}.hp.mp b{color:#2b5fa8}
.mpb{margin:4px 0}.mpb i{background:#2b5fa8}
.move.item{border-style:dashed}
#log{margin-top:14px;max-height:240px;overflow:auto;border-top:2px solid var(--blood);padding-top:8px}#log p{margin:4px 0;font-size:16px}
@media (max-width:560px){.fighters{grid-template-columns:1fr}}
.cr[hidden]{display:none}
#onl[hidden]{display:none}
#onl .slot{margin-bottom:8px}#onl hr{border:0;border-top:2px solid var(--blood);margin:14px 0}
#kw{width:230px;flex:none;font-size:20px}
#netbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--blood);color:#fff;font-family:var(--head);font-size:14px;padding:8px 12px;border-radius:3px;margin-bottom:10px}
#netbar:empty{display:none}
.mw{display:block}.mw .move{width:100%;height:100%}
#tip{position:fixed;z-index:50;max-width:260px;background:var(--ink);color:var(--parch);border:2px solid var(--gold);border-radius:3px;padding:8px 12px;font-family:var(--body);font-size:16px;line-height:1.3;box-shadow:0 4px 14px #000a;opacity:0;pointer-events:none;transition:opacity .15s}
#tip.show{opacity:1}
#help{border:3px solid var(--gold);border-radius:4px;padding:0;background:linear-gradient(var(--parch),var(--parch2));color:var(--text);width:min(900px,94vw);max-height:90vh;box-shadow:0 0 0 6px var(--leather),0 10px 40px #000c}
#help::backdrop{background:#000b}
#help .hb{padding:18px 22px 22px;overflow:auto;max-height:90vh}
#help h3{font-family:var(--head);font-size:17px;margin:18px 0 6px;color:var(--blood)}
#help p,#help li{font-size:17px;line-height:1.35;margin:6px 0}
#help ul{padding-left:20px;margin:6px 0}
#help .hx{float:right;margin:0 0 8px 12px}
#help .sc{background:#f3e6c4;border:2px solid var(--parch2);border-radius:4px;padding:6px 12px 10px;margin:10px 0}
#help .sc h3{margin-top:8px}
#help table{border-collapse:collapse;width:100%;font-size:15px;margin-top:6px}
#help th,#help td{border-bottom:1px solid var(--parch2);padding:3px 6px;text-align:left}
#help th{font-family:var(--head);font-size:12px}
#help td.n{white-space:nowrap}
#help .me{font-size:15px;color:var(--blood)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="cr">Scheda del personaggio</h1>
  <p class="sub cr">Forgia il tuo eroe, salvalo sul tuo PC e riprendilo quando vuoi.</p>

  <div class="bar cr">
    <button id="bHub" onclick="location.href='index.html'">← Torna all'hub</button>
    <button id="bNew">Nuovo personaggio</button>
    <button id="bLoad">Carica da file</button>
    <button id="bSave" class="btn main">Salva su PC</button>
    <button id="bHelp" aria-haspopup="dialog">📖 Come funzionano le stat</button>
    <input type="file" id="file" accept=".txt,text/plain" hidden>
    <input type="file" id="file2" accept=".txt,text/plain" hidden>
  </div>

  <section class="sheet cr">
    <div class="top">
      <label>Nome dell'eroe (max 9 caratteri)
        <input type="text" id="name" maxlength="9" autocomplete="off" placeholder="Es. Thorin">
      </label>
      <div class="hp" title="Punti ferita = Costituzione × 3 + 50"><b id="hp">42</b><span>Punti ferita</span></div>
      <div class="hp mp" title="Punti mana = Intelligenza × 5 + 30. In battaglia recuperi 5 + bonus Intelligenza PM a ogni tuo turno."><b id="mp">70</b><span>Punti mana</span></div>
    </div>
  </section>

  <section class="sheet cr">
    <h2>Caratteristiche <small id="statInfo"></small></h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="sheet cr">
    <h2>Mosse <small id="moveInfo"></small></h2>
    <div class="moves" id="moves"></div>
  </section>

  <section class="sheet" id="arena">
    <h2>Arena <small>Combattimento locale e online</small></h2>
    <div id="onl">
      <div class="slot"><span><b>Combattimento online</b>: voi due inserite la stessa parola chiave. Si usa la scheda attuale.</span>
        <input type="text" id="kw" maxlength="30" autocomplete="off" placeholder="Parola chiave">
        <button class="btn main" id="bJoin">Entra nella stanza</button></div>
      <hr>
    </div>
    <div id="setup"></div>
    <div id="fight" hidden>
      <div id="netbar"></div>
      <div class="fighters" id="fighters"></div>
      <div id="turn"></div>
      <div class="moves" id="bmoves"></div>
      <div id="log"></div>
    </div>
  </section>
</div>
<dialog id="help" aria-labelledby="helpT"><div class="hb" id="helpBody"></div></dialog>
<div id="toast" role="status"></div>

<script>
const STATS=[["forza","Forza","FOR"],["des","Destrezza","DES"],["costituzione","Costituzione","COS"],["intelligenza","Intelligenza","INT"],["saggezza","Saggezza","SAG"],["carisma","Carisma","CAR"]];
const MOVES=[["fireball",7,"🔥"],["dardo_incantato",2,"✨"],["raggio_rovente",7,"☀️"],["dito_della_morte",8,"💀"],["fulmine",6,"⚡"],["punizione_divina",4,"⚔️"],["attacco_furtivo",6,"🗡️"],["Ira",5,"😡"],["colpo_extra",5,"💥"],["Raffica_di_colpi",5,"👊"],["spingere",1,"🖐️"],["aiutare",1,"🤝"],["maleficio",4,"🌑"],["ragnatela",6,"🕸️"],["colpo_preciso",2,"🏹"],["cura_ferite",3,"❤️"],["parola_guaritrice",4,"🙏"],["mani_imposte",3,"🙌"]];
const MAX_STAT_POINTS=27, MAX_MOVE_POINTS=30, MAX_SLOTS=6;
const cost=s=>s<=13?s-8:(s===14?7:9);
const fresh=()=>({name:"",forza:8,des:8,costituzione:8,intelligenza:8,saggezza:8,carisma:8,moves:new Set()});
let st=fresh();
const $=id=>document.getElementById(id);

function validName(n){
  if(!n||n.length>9||/[ .]$/.test(n)||/[<>:"\/\\|?*\x00-\x1f]/.test(n))return false;
  return !/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(n);
}
function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="show"+(err?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3500)}
const statPoints=()=>STATS.reduce((a,s)=>a+cost(st[s[0]]),0);
const movePoints=()=>[...st.moves].reduce((a,i)=>a+MOVES[i][1],0);
const modStr=v=>{const m=Math.floor((v-10)/2);return (m>=0?"+":"")+m};
const pretty=n=>n.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());

function render(){
  const sp=statPoints(), mp=movePoints(), left=MAX_STAT_POINTS-sp;
  $("hp").textContent=st.costituzione*3+50;
  $("mp").textContent=st.intelligenza*5+30;
  $("statInfo").innerHTML=`Punti rimasti: <b>${left}/${MAX_STAT_POINTS}</b>`;
  $("stats").innerHTML=STATS.map(([k,full,ab])=>{
    const v=st[k], up=v<15&&cost(v+1)-cost(v)<=left, down=v>8;
    return `<div class="stat"><div class="n">${full}</div>
    <div class="d20"><div><b>${v}</b><i>${modStr(v)}</i></div></div>
    <div class="ctl"><button data-s="${k}" data-d="-1" ${down?"":"disabled"} aria-label="Riduci ${full}">−</button>
    <button data-s="${k}" data-d="1" ${up?"":"disabled"} aria-label="Aumenta ${full}">+</button></div>
    <div class="cost">Costo: ${cost(v)}</div></div>`}).join("");
  const full=st.moves.size>=MAX_SLOTS;
  $("moveInfo").innerHTML=`Punti: <b class="${mp>MAX_MOVE_POINTS?"bad":""}">${mp}/${MAX_MOVE_POINTS}</b> · Slot: <b>${st.moves.size}/${MAX_SLOTS}</b>`;
  $("moves").innerHTML=MOVES.map(([n,c,ic],i)=>{
    const on=st.moves.has(i), blocked=!on&&(full||mp+c>MAX_MOVE_POINTS);
    return `<div class="mw" data-tip="${esc(moveDesc(n)+(blocked?" (Non selezionabile: slot o punti insufficienti.)":""))}"><button class="move ${on?"on":""}" data-m="${i}" ${blocked?"disabled":""} aria-pressed="${on}">
    <span class="ic">${ic}</span><span>${pretty(n)}</span><span class="c">${c}</span></button></div>`}).join("");
}

/* Descrizioni delle mosse (tooltip nella scelta delle mosse) */
const SPEC_DESC={
  spingere:t=>`L'avversario ha svantaggio ai tiri per ${tn(t)} (due dadi, vale il peggiore).`,
  aiutare:t=>`Tu hai vantaggio ai tuoi tiri per ${tn(t)} (due dadi, vale il migliore).`,
  ragnatela:t=>`L'avversario è rallentato per ${tn(t)}: tu agisci sempre per primo.`,
  maleficio:t=>`L'avversario subisce 1d6 di danno a turno per ${tn(t)}.`,
  Ira:t=>`Per ${tn(t)} il tuo danno è moltiplicato per 1,5 (sul totale dado + bonus).`
};
function moveDesc(n,c=st){   // c = statistiche con cui calcolare i valori (di default quelle della scheda in creazione)
  const sn=k=>STATS.find(s=>s[0]===k)[1],k0=statOf(n),v=c[k0],ab=sn(k0)+" "+v;
  const[bpm,bms]=MECH[n],pm=pmCost(c,n),ms=missPct(c,n);
  const chg=(a,b,u)=>a===b?a+u:`${a}${u} (base ${b}${u})`;
  const tail=` Costo: ${chg(pm,bpm," PM")} · Precisione: ${chg(100-ms,100-bms,"%")}.`+((DMG[n]||HEAL[n])?` Critico (×1,5): ${fmt(critChance(c,n))}%.`:"");
  if(DMG[n]){const[k,a,f]=DMG[n];return `Danno: ${a}d${f} + ${bonus(v)} (bonus di ${ab}).`+tail}
  if(HEAL[n]){const[k,a,f]=HEAL[n];return `Cura: ${a}d${f} + ${bonus(v)} (bonus di ${ab}). Non supera i PF massimi.`+tail}
  return SPEC_DESC[n](specTurns(c,n))+` Usa ${ab}.`+tail;
}
const tip=document.createElement("div");tip.id="tip";tip.setAttribute("role","tooltip");document.body.appendChild(tip);
function showTip(w,x,y){
  tip.textContent=w.dataset.tip;tip.classList.add("show");
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(x+14,innerWidth-r.width-8))+"px";
  tip.style.top=(y+18+r.height>innerHeight?y-r.height-12:y+18)+"px";
}
const hideTip=()=>tip.classList.remove("show");
$("moves").addEventListener("mousemove",e=>{const w=e.target.closest(".mw");w?showTip(w,e.clientX,e.clientY):hideTip()});
$("moves").addEventListener("mouseleave",hideTip);
$("moves").addEventListener("focusin",e=>{const w=e.target.closest(".mw");if(w){const r=w.getBoundingClientRect();showTip(w,r.left,r.bottom-18)}});
$("moves").addEventListener("focusout",hideTip);
window.addEventListener("scroll",hideTip,{passive:true});

$("stats").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;st[b.dataset.s]+=+b.dataset.d;render()};
$("moves").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const i=+b.dataset.m;st.moves.has(i)?st.moves.delete(i):st.moves.add(i);render()};
$("name").oninput=e=>{st.name=e.target.value};
$("bNew").onclick=()=>{if(confirm("Vuoi ricominciare da un personaggio vuoto?")){st=fresh();$("name").value="";render()}};

$("bSave").onclick=()=>{
  if(!validName(st.name))return toast("Inserisci un nome valido (1-9 caratteri, senza simboli come / \\ : * ? \" < > |).",true);
  const lines=["PVP_CHARACTER 1","name="+st.name,...STATS.map(([k])=>k+"="+st[k]),"HP="+(st.costituzione*3+50),
    ...[...st.moves].sort((a,b)=>a-b).map(i=>"move="+MOVES[i][0])];
  const blob=new Blob([lines.join("\n")+"\n"],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=st.name+".txt";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Personaggio salvato come "+st.name+".txt");
};

$("bLoad").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{st=parse(r.result);$("name").value=st.name;render();toast("Personaggio "+st.name+" caricato.")}catch(err){toast(err.message,true)}};
  r.onerror=()=>toast("Impossibile leggere il file.",true);
  r.readAsText(f);
};

function parse(text){
  const L=text.split(/\r?\n/);
  while(L.length&&L[L.length-1].trim()==="")L.pop();
  if(L[0]!=="PVP_CHARACTER 1")throw new Error("File non valido: intestazione non riconosciuta.");
  const get=(i,key)=>{const l=L[i]||"";if(!l.startsWith(key+"="))throw new Error("File non valido: manca il campo "+key+".");return l.slice(key.length+1)};
  const p=fresh();
  p.name=get(1,"name");
  if(!validName(p.name))throw new Error("File non valido: nome non ammesso.");
  STATS.forEach(([k],j)=>{
    const raw=get(2+j,k);
    if(!/^\d+$/.test(raw.trim()))throw new Error("File non valido: "+k+" non è un numero.");
    const v=+raw;
    if(v<8||v>15)throw new Error("File non valido: "+k+" fuori dai limiti (8-15).");
    p[k]=v;
  });
  const total=STATS.reduce((a,s)=>a+cost(p[s[0]]),0);
  if(total>MAX_STAT_POINTS)throw new Error("File non valido: budget delle caratteristiche superato.");
  {const hp=get(8,"HP");if(!/^\d+$/.test(hp.trim()))throw new Error("File non valido: punti ferita non validi.");}   // i PF si ricalcolano dalla Costituzione: il valore nel file è solo informativo (compatibile con le schede vecchie)
  let pts=0;
  for(let i=9;i<L.length;i++){
    if(!L[i].startsWith("move="))throw new Error("File non valido: sezione mosse errata.");
    const mn=L[i].slice(5).trim().replace(/^ragio_rovente$/,"raggio_rovente");
    const idx=MOVES.findIndex(m=>m[0]===mn);
    if(idx<0)throw new Error("File non valido: mossa sconosciuta.");
    if(p.moves.has(idx))throw new Error("File non valido: mossa duplicata.");
    if(p.moves.size>=MAX_SLOTS)throw new Error("File non valido: più di 6 mosse.");
    p.moves.add(idx);pts+=MOVES[idx][1];
  }
  if(pts>MAX_MOVE_POINTS)throw new Error("File non valido: budget delle mosse superiore a 30.");
  return p;
}
/* ===== Arena: motore di combattimento locale ===== */
const DMG={dardo_incantato:["intelligenza",1,6],colpo_preciso:["des",1,6],punizione_divina:["carisma",1,8],colpo_extra:["forza",1,10],Raffica_di_colpi:["forza",2,4],attacco_furtivo:["des",2,6],fulmine:["intelligenza",1,12],fireball:["intelligenza",2,8],raggio_rovente:["carisma",2,8],dito_della_morte:["saggezza",2,10]};
const HEAL={cura_ferite:["saggezza",3,6],mani_imposte:["carisma",3,6],parola_guaritrice:["saggezza",3,8]};
const SPEC={spingere:["svantaggio",2,1],aiutare:["vantaggio",2,0],ragnatela:["lento",3,1],maleficio:["male",4,1],Ira:["ira",3,0]}; // [effetto, azioni, su avversario?]
const FX={svantaggio:"Svantaggio",vantaggio:"Vantaggio",lento:"Rallentato",male:"Maleficio",ira:"Ira"};
const MI=Object.fromEntries(MOVES.map(m=>[m[0],m[2]]));
/* [costo PM, % di miss] per ogni mossa */
const MECH={spingere:[3,5],aiutare:[4,0],dardo_incantato:[10,5],colpo_preciso:[7,10],cura_ferite:[13,0],mani_imposte:[15,0],punizione_divina:[18,18],maleficio:[12,10],parola_guaritrice:[17,0],Ira:[8,0],colpo_extra:[4,25],Raffica_di_colpi:[3,10],fulmine:[23,15],attacco_furtivo:[10,25],ragnatela:[17,15],fireball:[27,12],raggio_rovente:[27,15],dito_della_morte:[33,25]};
const AB=Object.fromEntries(STATS.map(s=>[s[0],s[2]]));
/* Critici stile Pokémon: dopo che la mossa va a segno, 1/24 di probabilità (1/8 per le mosse "precise"); danni e cure ×1,5 */
const CRIT_LO=1/24, HICRIT=new Set(["attacco_furtivo","colpo_preciso"]);   // CRIT_LO resta fisso solo per Struggle
/* ===== Scaling in base alle statistiche =====
   Ogni mossa ha una statistica di riferimento (statOf). Valore 12 = standard (i numeri di MECH):
   sotto 12 costo e fallimento salgono, sopra 12 scendono; critici e durate degli effetti crescono con la stat.
   Prendono "s" = oggetto con le statistiche (f.s in battaglia, st nella creazione). */
const SPEC_STAT={spingere:"forza",aiutare:"carisma",ragnatela:"intelligenza",maleficio:"saggezza",Ira:"costituzione"};
const statOf=n=>(DMG[n]||HEAL[n]||[SPEC_STAT[n]])[0];
const REF=12;
const pmCost=(s,n)=>{const v=s[statOf(n)];return Math.max(1,Math.round(MECH[n][0]*(v<REF?1+0.125*(REF-v):1-0.04*(v-REF))))};   // INT 8: +50% · 15: −12%
const missPct=(s,n)=>{if(HEAL[n])return 0;const v=s[statOf(n)];return Math.max(0,Math.round(MECH[n][1]+(v<REF?3.75*(REF-v):-5/3*(v-REF))))};        // 8: +15 punti · 15: −5 punti
const critChance=(s,n)=>{const v=s[statOf(n)];return HICRIT.has(n)?Math.max(5,Math.min(25,12.5+2.5*(v-REF))):Math.max(1,Math.min(12,4+2*(v-REF)))};  // in %
const SPEC_MAXBONUS={spingere:2,aiutare:2,ragnatela:1,maleficio:1,Ira:1};   // turni extra massimi: i debuff "economici" crescono di più, quelli già forti (Ira, Maleficio, Ragnatela) di meno
const specTurns=(s,n)=>{const v=s[statOf(n)];return Math.max(1,SPEC[n][1]+(v>=15?SPEC_MAXBONUS[n]:v>=13?1:0)-(v<=9?1:0))};   // ≤9: −1 turno · 13–14: +1 · 15: +1 (o +2 per Spingere/Aiutare)
const fmt=x=>String(Math.round(x*10)/10).replace(".",","), tn=t=>t+(t===1?" turno":" turni");
const mpRegen=f=>5+Math.floor((f.s.intelligenza-8)/2);          // PM recuperati a ogni tua azione: 5 + bonus Intelligenza
const offUsable=f=>f.mv.some(n=>DMG[n]&&f.mp>=pmCost(f.s,n));      // ha almeno una mossa offensiva che può permettersi?
// Azioni speciali: "__cura" e "__mana" = oggetti monouso (ce li hanno tutti); "__struggle" = solo se non hai nessuna mossa offensiva utilizzabile
const canPlay=(f,n)=>n==="__struggle"?!offUsable(f)
  :n==="__cura"?!!f.it.cura&&f.hp<f.max
  :n==="__mana"?!!f.it.mana&&f.mp<f.mpmax
  :f.mv.includes(n)&&f.mp>=pmCost(f.s,n);
const bonus=v=>Math.floor((v-8)/2), die=f=>1+Math.floor(Math.random()*f);
const dice=(n,f)=>{let t=0;for(let i=0;i<n;i++)t+=die(f);return t};
const esc=t=>String(t).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
let P=[null,null],B=null,slot=0;
const showCreation=on=>{document.querySelectorAll(".cr").forEach(el=>el.hidden=!on);window.scrollTo(0,0)};

function roll(n,f,adv,dis){            // vantaggio/svantaggio: si tira l'intero lancio due volte
  const a=dice(n,f);
  if(adv===dis)return{t:a,x:n+"d"+f+" = "+a};   // nessuno dei due, oppure si annullano
  const b=dice(n,f),t=adv?Math.max(a,b):Math.min(a,b);
  return{t,x:n+"d"+f+": "+a+" e "+b+", "+(adv?"vantaggio":"svantaggio")+" → "+t};
}
const mkFighter=p=>({name:p.name,s:Object.fromEntries(STATS.map(([k])=>[k,p[k]])),max:p.costituzione*3+50,hp:p.costituzione*3+50,mpmax:p.intelligenza*5+30,mp:p.intelligenza*5+30,it:{cura:true,mana:true},
  mv:[...p.moves].sort((a,b)=>a-b).map(i=>MOVES[i][0]),fx:{svantaggio:0,vantaggio:0,lento:0,male:0,ira:0}});
const say=t=>{B.log.unshift(t);if(B.log.length>60)B.log.length=60};
let QUIET=false,ON=null;                 // QUIET: calcola senza disegnare (transazioni online); ON: {seat,rm,gone} se si gioca online
const draw=()=>{if(!QUIET)renderB()};

function startRound(){
  B.round++;
  const[a,b]=B.f,sa=a.fx.lento>0,sb=b.fx.lento>0;let first,why;
  if(sa!==sb){first=sa?1:0;why=B.f[1-first].name+" è rallentato"}
  else if(a.s.des!==b.s.des){first=a.s.des>b.s.des?0:1;why="Destrezza più alta"}
  else{let x,y;do{x=die(20);y=die(20)}while(x===y);first=x>y?0:1;why="Destrezza pari, d20: "+x+" contro "+y}
  B.order=[first,1-first];B.pos=0;
  say("Round "+B.round+": agisce per primo "+B.f[first].name+" ("+why+").");
  beginAction();
}
function beginAction(){                 // gli effetti si scalano sulle azioni di chi li subisce
  const i=B.order[B.pos],f=B.f[i];B.act={};
  for(const k in f.fx){if(f.wait===k){f.wait=null;B.act[k]=false;continue}B.act[k]=f.fx[k]>0;if(f.fx[k]>0)f.fx[k]--}
  if(f.mp<f.mpmax)f.mp=Math.min(f.mpmax,f.mp+mpRegen(f));   // rigenerazione PM a inizio di ogni tua azione
  if(B.act.male){const t=die(6);f.hp=Math.max(0,f.hp-t);say(f.name+" subisce "+t+" danni dal maleficio (1d6).");if(f.hp<=0)return finish(1-i)}
  draw();
}
function finish(w){B.over=w;say(B.f[w].name+" vince la battaglia!");draw()}
function useMove(n){
  const i=B.order[B.pos],f=B.f[i],g=B.f[1-i],a=B.act,e=DMG[n]||HEAL[n];
  const next=()=>{B.pos++;B.pos<2?beginAction():startRound()};
  if(!canPlay(f,n))return;
  if(n==="__cura"){const h=f.max-f.hp;f.it.cura=false;f.hp=f.max;say(f.name+" usa Cura totale e recupera "+h+" PF.");return next()}
  if(n==="__mana"){const m=f.mpmax-f.mp;f.it.mana=false;f.mp=f.mpmax;say(f.name+" usa Elisir di mana e recupera "+m+" PM.");return next()}
  if(n==="__struggle"){
    const r=roll(1,10,a.vantaggio,a.svantaggio);let t=r.t,x=r.x;
    const cr=Math.random()<CRIT_LO,ck=cr?" Colpo critico!":"";
    if(cr){t=Math.floor(t*1.5);x+=", critico ×1,5 → "+t}
    if(a.ira){t=Math.floor(t*1.5);x+=", Ira ×1,5 → "+t}
    g.hp=Math.max(0,g.hp-t);say(f.name+" usa Struggle: "+t+" danni a "+g.name+" ("+x+")."+ck);
    if(g.hp<=0)return finish(i);
    const rc=Math.ceil(f.max*0.25);f.hp=Math.max(0,f.hp-rc);say(f.name+" subisce "+rc+" danni di contraccolpo (25% dei PF massimi).");
    if(f.hp<=0)return finish(1-i);
    return next();
  }
  if(die(100)<=missPct(f.s,n)){say(f.name+" usa "+pretty(n)+"... ma fallisce il colpo!");return next()}   // miss: nessun PM consumato
  f.mp-=pmCost(f.s,n);
  if(e){
    const r=roll(e[1],e[2],a.vantaggio,a.svantaggio),bo=bonus(f.s[e[0]]);
    let t=r.t+bo,x=r.x+" + "+bo;
    const cr=Math.random()*100<critChance(f.s,n),ck=cr?" Colpo critico!":"";
    if(cr){t=Math.floor(t*1.5);x+=", critico ×1,5 → "+t}
    if(HEAL[n]){const h=Math.min(f.max,f.hp+t)-f.hp;f.hp+=h;say(f.name+" usa "+pretty(n)+" e recupera "+h+" PF ("+x+")."+ck)}
    else{if(a.ira){t=Math.floor(t*1.5);x+=", Ira ×1,5 → "+t}
      g.hp=Math.max(0,g.hp-t);say(f.name+" usa "+pretty(n)+": "+t+" danni a "+g.name+" ("+x+")."+ck)}
  }else{
    const[k,,opp]=SPEC[n],d=specTurns(f.s,n),T=opp?g:f;T.fx[k]=d;if(n==="ragnatela"&&B.pos===0)T.wait=k; // se chi la lancia è già primo, il round in corso non conta
    say(f.name+" usa "+pretty(n)+": "+T.name+" ha "+FX[k]+" per "+d+" azioni.");
  }
  if(g.hp<=0)return finish(i);
  B.pos++;B.pos<2?beginAction():startRound();
}

function renderB(){
  const cur=B.f[B.order[B.pos]],left=(f,i,k)=>f.fx[k]+(B.over==null&&B.order[B.pos]===i&&B.act[k]?1:0);
  $("fighters").innerHTML=B.f.map((f,i)=>`<div class="fc${B.over==null&&B.order[B.pos]===i?" act":""}${f.hp<=0?" ko":""}"><b>${esc(f.name)}</b>${ON&&ON.seat===i?" (tu)":""}
    <div class="hpb"><i style="width:${100*f.hp/f.max}%"></i></div><div class="hpn">${f.hp} / ${f.max} PF</div>
    <div class="hpb mpb"><i style="width:${100*f.mp/f.mpmax}%"></i></div><div class="hpn">${f.mp} / ${f.mpmax} PM</div>
    <div>${Object.keys(FX).filter(k=>left(f,i,k)>0).map(k=>`<span class="chip">${FX[k]} (${left(f,i,k)})</span>`).join("")||"&nbsp;"}</div></div>`).join("");
  const mine=!ON||B.order[B.pos]===ON.seat;   // online: i pulsanti sono tuoi e attivi solo nel tuo turno
  let tr;
  if(B.over!=null){
    tr=`<b>${esc(B.f[B.over].name)} vince!</b>`;
    if(!ON)tr+=`<button id="bAgain">Nuova battaglia</button>`;
    else{const me=ON.rm[ON.seat],they=ON.rm[1-ON.seat];
      tr+=`<button id="bRematch"${me||ON.gone?" disabled":""}>${ON.gone?"L'avversario è uscito":me?"In attesa dell'avversario…":they?"Rivincita (l'avversario è pronto)":"Rivincita"}</button><button id="bLeave">Esci</button>`}
  }else tr=`Round ${B.round}: tocca a <b>${esc(cur.name)}</b>${ON&&mine?" (è il tuo turno)":""}<button id="${ON?"bLeave":"bAgain"}">Abbandona</button>`;
  $("turn").innerHTML=tr;
  const my=ON?B.f[ON.seat]:cur;
  $("bmoves").innerHTML=B.over!=null?"":my.mv.map(n=>{const e=DMG[n]||HEAL[n],pm=pmCost(my.s,n),ms=missPct(my.s,n),ok=my.mp>=pm,
      lab=(e?e[1]+"d"+e[2]+"+"+AB[e[0]]+"(+"+bonus(my.s[e[0]])+")":(SPEC[n][2]?"su avversario":"su di sé")+" · "+tn(specTurns(my.s,n)))+" | "+pm+" PM | Acc: "+(100-ms)+"%"+(e?" | Crit: "+fmt(critChance(my.s,n))+"%":"");
    return `<button class="move" data-bm="${n}"${mine&&ok?"":" disabled"}${ok?"":' title="PM insufficienti"'}><span class="ic">${MI[n]}</span><span class="nm">${pretty(n)}<small>${lab}</small></span></button>`}).join("")
    +[["__cura","🧪","Cura totale","PF al massimo | Monouso | "+(my.it.cura?"Disponibile":"Esaurito"),my.it.cura&&my.hp<my.max],
      ["__mana","🔮","Elisir di mana","PM al massimo | Monouso | "+(my.it.mana?"Disponibile":"Esaurito"),my.it.mana&&my.mp<my.mpmax]]
      .map(([id,ic,nm,d,ok])=>`<button class="move item" data-bm="${id}"${mine&&ok?"":" disabled"}><span class="ic">${ic}</span><span class="nm">${nm}<small>${d}</small></span></button>`).join("")
    +(mine&&!offUsable(my)?`<button class="move" data-bm="__struggle"><span class="ic">💢</span><span class="nm">Struggle<small>1d10 | 0 PM | Contraccolpo: 25% PF max</small></span></button>`:"");
  $("log").innerHTML=B.log.map(l=>`<p>${esc(l)}</p>`).join("");
}
function renderSetup(){
  $("setup").innerHTML=[0,1].map(i=>`<div class="slot"><span>Giocatore ${i+1}: <b>${P[i]?esc(P[i].name):"nessun personaggio"}</b></span>
    <button data-use="${i}">Usa la scheda attuale</button><button data-ld="${i}">Carica da file</button></div>`).join("")
    +`<button class="btn main" id="bGo"${P[0]&&P[1]?"":" disabled"}>Inizia battaglia</button>`;
}
const NET=(fn,...a)=>window.PVPNET?window.PVPNET[fn](...a):toast("Online non disponibile: Firebase non si è caricato (sei connesso a internet?).",true);
$("kw").onkeydown=e=>{if(e.key==="Enter")NET("join",$("kw").value)};
$("arena").onclick=e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
  if(d.use!=null){
    if(!validName(st.name))return toast("Dai un nome valido al personaggio prima di usarlo.",true);
    if(!st.moves.size)return toast("Scegli almeno una mossa.",true);
    P[+d.use]={...st,moves:new Set(st.moves)};renderSetup();
  }else if(d.ld!=null){slot=+d.ld;$("file2").click()}
  else if(b.id==="bGo"){B={f:P.map(mkFighter),round:0,log:[],over:null};$("setup").hidden=true;$("onl").hidden=true;$("fight").hidden=false;showCreation(false);startRound()}
  else if(d.bm){if(ON)NET("play",d.bm);else if(B.over==null)useMove(d.bm)}
  else if(b.id==="bAgain"){B=null;$("fight").hidden=true;$("setup").hidden=false;$("onl").hidden=false;showCreation(true);renderSetup()}
  else if(b.id==="bJoin")NET("join",$("kw").value);
  else if(b.id==="bLeave")NET("leave");
  else if(b.id==="bRematch")NET("rematch");
  else if(b.id==="bClaim")NET("claim");
};
$("file2").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const p=parse(r.result);if(!p.moves.size)throw new Error("Il personaggio non ha nessuna mossa.");P[slot]=p;renderSetup()}catch(err){toast(err.message,true)}};
  r.onerror=()=>toast("Impossibile leggere il file.",true);
  r.readAsText(f);
};
/* ===== Guida: come le caratteristiche influenzano mosse e battaglia (i numeri sono calcolati con le formule reali del gioco) ===== */
const HELP_STAT={
  forza:["Danno delle mosse fisiche (Colpo extra, Raffica di colpi) e potenza di Spingere.","Ottima per chi vuole colpire spesso spendendo pochissimi PM: le mosse fisiche costano poco ma sbagliano di più."],
  des:["Iniziativa: chi ha la Destrezza più alta agisce per primo in ogni round (a parità si tira un d20). Alimenta anche Colpo preciso e Attacco furtivo.","Agire per primo può chiudere lo scontro prima che l'avversario si muova. Le mosse da Destrezza hanno più critici."],
  costituzione:["Punti ferita: PF = Costituzione × 3 + 50. Alimenta anche Ira.","Ogni punto vale 3 PF in più: è la statistica più sicura, ma non fa danno né dà PM."],
  intelligenza:["Punti mana: PM = Intelligenza × 5 + 30, e ne recuperi 5 + bonus Intelligenza a ogni tuo turno. Alimenta Dardo incantato, Fulmine, Fireball e Ragnatela.","Senza mana le mosse potenti non si usano: con INT bassa le magie costano di più e sbagliano più spesso."],
  saggezza:["Cura delle mosse di guarigione (Cura ferite, Parola guaritrice), Dito della morte e Maleficio.","È la stat del sostegno: più curi, più la battaglia si allunga a tuo favore, ma devi poterti permettere il mana."],
  carisma:["Danno di Punizione divina e Raggio rovente, cura di Mani imposte, durata di Aiutare.","Una stat versatile che sta a metà tra attacco e cura."]
};
function openHelp(){
  const mv=n=>pretty(n);
  const rows=k=>MOVES.map(m=>m[0]).filter(n=>statOf(n)===k).map(n=>{
    const at=v=>{const c={...st,[k]:v};return pmCost(c,n)+" PM · "+(100-missPct(c,n))+"%"};
    const eff=DMG[n]?"danno":HEAL[n]?"cura":"effetto";
    const cur=(DMG[n]||HEAL[n])?fmt(critChance(st,n))+"% crit":tn(specTurns(st,n));
    return `<tr><td class="n">${MI[n]} ${mv(n)}</td><td>${eff}</td><td>${at(8)}</td><td>${at(12)}</td><td>${at(15)}</td><td>${cur}</td></tr>`}).join("");
  $("helpBody").innerHTML=`<button class="hx" id="helpX">Chiudi ✕</button><h2 id="helpT">Come le tue scelte cambiano il gioco</h2>
  <p>Ogni mossa è legata a <b>una sola caratteristica</b>: è quella che ne decide potenza, costo, precisione e durata. Scegliere dove mettere i punti significa scegliere quali mosse saranno forti e quali resteranno deboli.</p>
  <h3>Le regole generali</h3><ul>
  <li><b>Valore 12 = standard.</b> Sotto 12 le mosse di quella stat costano più PM e falliscono più spesso; sopra 12 costano meno e sbagliano meno. <b>Le cure non mancano mai</b>: la stat ne cambia solo costo ed efficacia.</li>
  <li><b>Bonus ai dadi</b> = (valore − 8) ÷ 2, arrotondato per difetto: a 8 vale +0, a 12 vale +2, a 15 vale +3. Si somma a danni e cure.</li>
  <li><b>Critici:</b> dopo che la mossa va a segno ci sono poche probabilità di fare ×1,5 su danno o cura. Crescono con la stat (Colpo preciso e Attacco furtivo ne hanno di più).</li>
  <li><b>Effetti (Spingere, Aiutare, Ragnatela, Maleficio, Ira):</b> con stat alta durano 1-2 azioni in più, con stat bassa una in meno.</li>
  <li><b>Un colpo mancato non consuma PM</b>, quindi una mossa imprecisa fa perdere il turno ma non il mana.</li>
  <li><b>Costo dei punti:</b> i punti di caratteristica costano 1 fino a 13, poi 2 per il 14 e il 15. Un po' di tutto è sempre più sicuro di una sola stat altissima.</li>
  <li><b>Mosse e slot:</b> hai 30 punti mossa e 6 slot. Le mosse da 6-8 punti sono potenti ma ne entrano poche; quelle da 1-2 sono economiche ma deboli.</li></ul>
  <h3>Cosa succede in battaglia</h3><ul>
  <li>Il combattimento è a turni: prima agisce chi ha più Destrezza. Ragnatela rallenta l'avversario e ti fa agire sempre per primo.</li>
  <li>A ogni tuo turno recuperi PM: se li esaurisci e non hai mosse offensive utilizzabili ti resta solo <b>Struggle</b>, che ti ferisce del 25% dei PF massimi.</li>
  <li>Hai due oggetti monouso: <b>Cura totale</b> e <b>Elisir di mana</b>. Usarli al momento giusto è parte dell'abilità.</li>
  <li><b>Nessuna build vince contro tutto:</b> le build ricche di danno battono quelle di cura lenta, ma soffrono contro chi agisce prima o ha molti PF. Conta anche scegliere la mossa giusta a ogni turno.</li></ul>
  <h3>Le sei caratteristiche</h3>
  ${STATS.map(([k,full])=>`<div class="sc"><h3>${full} <span class="me">(la tua: ${st[k]}, bonus ${bonus(st[k])>=0?"+":""}${bonus(st[k])})</span></h3>
    <p>${HELP_STAT[k][0]}</p><p><i>${HELP_STAT[k][1]}</i></p>
    ${rows(k)?`<table><tr><th>Mossa</th><th>Tipo</th><th>Con ${full} 8</th><th>Con 12</th><th>Con 15</th><th>Alla tua stat</th></tr>${rows(k)}</table>`:""}</div>`).join("")}
  <p class="me">I numeri della tabella sono quelli reali del gioco: costo in PM e precisione della mossa con quel valore. Prova a cambiare le tue caratteristiche e riaprire la guida per vedere come cambia l'ultima colonna.</p>`;
  const d=$("help");d.showModal();$("helpBody").scrollTop=0;
}
$("bHelp").onclick=openHelp;
$("help").addEventListener("click",e=>{if(e.target===$("help")||e.target.id==="helpX")$("help").close()});
render();renderSetup();
</script>

  projectId: "pvp-arena-a2adc",
  storageBucket: "pvp-arena-a2adc.firebasestorage.app",
  messagingSenderId: "589262815731",
  appId: "1:589262815731:web:fd79e42dcba3c7665c1286"
});
// Persistenza "di sessione": ogni scheda del browser è un utente anonimo diverso (utile per provare da soli con 2 schede)
const auth = initializeAuth(app, { persistence: browserSessionPersistence });
const db = getFirestore(app);

let authP = null;
const authReady = () => authP || (authP = signInAnonymously(auth).then(c => c.user.uid).catch(e => { authP = null; throw e }));
authReady().catch(() => {});

const PULSE_MS = 10000, GONE_MS = 45000, STALE_MS = 600000;
const clone = o => JSON.parse(JSON.stringify(o));
const toP = c => ({ ...c, moves: new Set(c.moves) });
const msg = e => e && e.code === "permission-denied" ? "Permesso negato da Firestore: controlla le regole del database."
  : e && String(e.code).startsWith("auth/") ? "Accesso anonimo non riuscito (" + e.code + ")."
  : (e && e.message) || "Errore sconosciuto.";

const mine = () => ({ name: st.name, ...Object.fromEntries(STATS.map(([k]) => [k, st[k]])), moves: [...st.moves].sort((a, b) => a - b) });

function okChar(c) {            // stesse regole di creazione/caricamento, applicate alla scheda dell'avversario
  if (!c || !validName(c.name)) return false;
  let sp = 0;
  for (const [k] of STATS) { const v = c[k]; if (!Number.isInteger(v) || v < 8 || v > 15) return false; sp += cost(v) }
  if (sp > MAX_STAT_POINTS) return false;
  if (!Array.isArray(c.moves) || !c.moves.length || c.moves.length > MAX_SLOTS) return false;
  let mp = 0; const seen = new Set();
  for (const i of c.moves) { if (!Number.isInteger(i) || !MOVES[i] || seen.has(i)) return false; seen.add(i); mp += MOVES[i][1] }
  return mp <= MAX_MOVE_POINTS;
}
function kwId(raw) {
  const k = raw.trim().toLowerCase().replace(/\s+/g, "-");
  return /^[\p{L}\p{N}_-]{3,30}$/u.test(k) && !/^__.*__$/.test(k) ? k : null;
}
function newGame(chars) {       // crea una battaglia nuova (senza disegnare) e la restituisce come oggetto semplice
  B = { f: chars.map(c => mkFighter(toP(c))), round: 0, log: [], over: null };
  QUIET = true; try { startRound() } finally { QUIET = false }
  return clone(B);
}

let net = null, joining = false;
const wait = document.createElement("div"); wait.id = "wait"; wait.hidden = true; $("onl").after(wait);

function resetUI() {
  B = null; ON = null; QUIET = false;
  $("fight").hidden = true; wait.hidden = true; $("setup").hidden = false; $("onl").hidden = false;
  $("netbar").innerHTML = ""; showCreation(true); renderSetup();
}
function teardown() {
  if (!net) return;
  net.unsub && net.unsub(); clearInterval(net.pulseT); clearInterval(net.watchT);
  document.removeEventListener("visibilitychange", onVis);
  net = null;
}

async function join(raw) {
  if (net || joining) return;
  const kw = kwId(raw);
  if (!kw) return toast("Parola chiave non valida: 3-30 caratteri tra lettere, numeri, - e _.", true);
  if (!validName(st.name)) return toast("Dai un nome valido al personaggio prima di entrare.", true);
  if (!st.moves.size) return toast("Scegli almeno una mossa.", true);
  joining = true;
  const c = mine();
  try {
    const uid = await authReady();
    const ref = doc(db, "rooms", kw);
    const seat = await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      const fresh = () => ({ seats: [uid, null], chars: [c, null], status: "waiting", game: null, rm: [false, false], left: [false, false], p0: 0, p1: 0, v: 0, upd: serverTimestamp() });
      if (!s.exists()) { tx.set(ref, fresh()); return 0 }
      const d = s.data(), i = d.seats.indexOf(uid);
      if (i >= 0) { tx.update(ref, { left: d.left.map((x, j) => j === i ? false : x), upd: serverTimestamp() }); return i }   // rientro nella propria stanza
      if (d.seats[1] === null) {                                                                                         // si prende il secondo posto: parte la battaglia
        const chars = [d.chars[0], c];
        if (!okChar(chars[0])) throw new Error("La scheda dell'altro giocatore non è valida.");
        tx.update(ref, { seats: [d.seats[0], uid], chars, status: "fight", game: newGame(chars), rm: [false, false], left: [false, false], v: d.v + 1, upd: serverTimestamp() });
        return 1;
      }
      const age = Date.now() - (d.upd && d.upd.toMillis ? d.upd.toMillis() : Date.now());
      if (age > STALE_MS) { tx.set(ref, fresh()); return 0 }                                                            // stanza abbandonata da oltre 10 minuti: si riusa
      throw new Error("Stanza piena: scegliete un'altra parola chiave.");
    });
    attach(ref, kw, uid, seat);
  } catch (e) { toast(msg(e), true) }
  finally { joining = false }
}

function attach(ref, kw, uid, seat) {
  net = { ref, kw, uid, seat, v: -1, key: "", opp: { n: -1, t: Date.now() }, seen: false, inFight: false, hasOpp: false, left: false, busy: false, game: null };
  ON = { seat, rm: [false, false], gone: false };
  net.unsub = onSnapshot(ref, onSnap, e => toast(msg(e), true));
  net.pulseT = setInterval(pulse, PULSE_MS);
  net.watchT = setInterval(refresh, 3000);
  document.addEventListener("visibilitychange", onVis);
  pulse();
}
function pulse() { if (net) updateDoc(net.ref, { ["p" + net.seat]: increment(1), upd: serverTimestamp() }).catch(() => {}) }
function onVis() { if (!document.hidden) pulse() }

function onSnap(s) {
  if (!net) return;
  if (!s.exists()) { if (net.seen) { toast("La stanza è stata chiusa.", true); teardown(); resetUI() } return }
  net.seen = true;
  const d = s.data(), o = 1 - net.seat;
  if (d["p" + o] !== net.opp.n) { net.opp.n = d["p" + o]; net.opp.t = Date.now() }   // l'avversario è "vivo" finché il suo contatore cambia
  net.hasOpp = d.seats[o] !== null; net.left = !!d.left[o];
  ON.rm = d.rm;
  if (d.status === "fight" && d.game) {
    net.game = d.game;
    if (d.v !== net.v) { net.v = d.v; B = clone(d.game) }
    if (!net.inFight) {
      net.inFight = true; wait.hidden = true; $("setup").hidden = true; $("onl").hidden = true; $("fight").hidden = false; showCreation(false);
    }
  } else if (!net.inFight) {
    $("onl").hidden = true; $("setup").hidden = true; wait.hidden = false;
    wait.innerHTML = `<div class="slot"><span>Stanza <b>${esc(net.kw)}</b> creata. In attesa dell'avversario: comunicategli la parola chiave.</span><button id="bLeave">Annulla</button></div>`;
  }
  refresh();
}

function refresh() {               // ridisegna solo se qualcosa è cambiato
  if (!net || !net.inFight || !B) return;
  ON.gone = net.hasOpp && (net.left || Date.now() - net.opp.t > GONE_MS);
  const key = [net.v, ON.rm.join(), ON.gone, B.over].join("|");
  if (key === net.key) return;
  net.key = key;
  $("netbar").innerHTML = `<span>Stanza <b>${esc(net.kw)}</b> · avversario ${ON.gone ? "disconnesso" : "connesso"}</span>`
    + (ON.gone && B.over == null ? `<button id="bClaim">Vinci a tavolino</button>` : "");
  renderB();
}

async function play(n) {
  if (!net || net.busy) return;
  net.busy = true;
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(net.ref);
      if (!s.exists()) throw new Error("La stanza non esiste più.");
      const d = s.data(), g = clone(d.game);
      if (d.status !== "fight" || !g || g.over != null || g.order[g.pos] !== net.seat || !canPlay(g.f[net.seat], n)) throw new Error("Non puoi usare questa mossa adesso.");
      B = g; QUIET = true; try { useMove(n) } finally { QUIET = false }
      tx.update(net.ref, { game: clone(B), v: d.v + 1, upd: serverTimestamp() });
    });
  } catch (e) { toast(msg(e), true); if (net && net.game) B = clone(net.game) }
  finally { if (net) net.busy = false }
}

async function rematch() {
  if (!net) return;
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(net.ref); if (!s.exists()) throw new Error("La stanza non esiste più.");
      const d = s.data(); if (!d.game || d.game.over == null) return;
      const rm = d.rm.map((x, j) => j === net.seat ? true : x);
      if (rm[0] && rm[1]) {
        if (!okChar(d.chars[0]) || !okChar(d.chars[1])) throw new Error("Una delle schede non è valida.");
        tx.update(net.ref, { game: newGame(d.chars), rm: [false, false], v: d.v + 1, upd: serverTimestamp() });
      } else tx.update(net.ref, { rm, upd: serverTimestamp() });
    });
  } catch (e) { toast(msg(e), true); if (net && net.game) B = clone(net.game) }
}

async function claim() {            // l'avversario è sparito: vittoria a tavolino
  if (!net) return;
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(net.ref); if (!s.exists()) throw new Error("La stanza non esiste più.");
      const d = s.data(), g = clone(d.game); if (!g || g.over != null) return;
      B = g; QUIET = true;
      try { say(g.f[1 - net.seat].name + " non risponde più: vittoria a tavolino."); finish(net.seat) } finally { QUIET = false }
      tx.update(net.ref, { game: clone(B), v: d.v + 1, upd: serverTimestamp() });
    });
  } catch (e) { toast(msg(e), true); if (net && net.game) B = clone(net.game) }
}

async function leave() {
  if (!net) return;
  const n = net, gone = ON && ON.gone;
  teardown(); resetUI();
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(n.ref); if (!s.exists()) return;
      const d = s.data(), o = 1 - n.seat;
      if (d.status === "waiting" || d.seats[o] === null || d.left[o] || gone) tx.delete(n.ref);          // nessuno resta: si chiude la stanza
      else tx.update(n.ref, { left: d.left.map((x, j) => j === n.seat ? true : x), upd: serverTimestamp() });
    });
  } catch (e) { /* la stanza scadrà da sola */ }
}

window.PVPNET = { join, play, leave, rematch, claim };
</script>
